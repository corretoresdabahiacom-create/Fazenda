<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agro Gestão</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2d6a4f" />
    <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agro Gestão" />
    <script>
      // Aplica o modo verde (escuro) imediatamente, antes do React
      // carregar, pra não piscar a tela clara por uma fração de segundo.
      (function () {
        var saved = localStorage.getItem('theme');
        if (saved !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
